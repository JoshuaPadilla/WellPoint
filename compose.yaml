services:
    db:
        image: postgres:16-alpine
        container_name: wellpoint_db
        restart: unless-stopped
        ports:
            - "${DB_PORT:-5434}:5432"
        environment:
            POSTGRES_USER: ${DB_USER:-wellpoint}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-wellpoint}
            POSTGRES_DB: ${DB_NAME:-wellpoint}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USER:-wellpoint} -d ${DB_NAME:-wellpoint}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - wellpoint-network

    api:
        build:
            context: ./backend
            target: development
        container_name: wellpoint_api
        restart: unless-stopped
        environment:
            NODE_ENV: development
            PORT: 4000
            DB_HOST: db
            DB_PORT: 5432
            DB_USER: ${DB_USER:-wellpoint}
            DB_PASSWORD: ${DB_PASSWORD:-wellpoint}
            DB_NAME: ${DB_NAME:-wellpoint}
            DB_SYNC: "true"
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
        ports:
            - "${API_PORT:-4000}:4000"
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./backend:/usr/src/app
            - ./seed-data:/usr/src/seed-data:ro
            - api_node_modules:/usr/src/app/node_modules
        networks:
            - wellpoint-network

    web:
        build:
            context: ./frontend
            target: development
        container_name: wellpoint_web
        restart: unless-stopped
        stdin_open: true # Keeps Vite/CRA/Next.js interactive and prevents early exit
        tty: true
        environment:
            NODE_ENV: development
            PORT: 3000
            API_PROXY_TARGET: http://api:4000
            WATCHPACK_POLLING: "true" # Enables polling if using Webpack / Next.js
            CHOKIDAR_USEPOLLING: "true" # Enables polling for Vite / Chokidar watchers
        ports:
            - "${WEB_PORT:-3000}:3000"
        depends_on:
            - api
        volumes:
            - ./frontend:/usr/src/app
            - web_node_modules:/usr/src/app/node_modules
        networks:
            - wellpoint-network

volumes:
    pgdata:
        driver: local
    api_node_modules:
    web_node_modules:

networks:
    wellpoint-network:
        driver: bridge
